- name: Apply User configuration
  hosts: target
  become: yes

  vars_files:
    - ../vars/users.yml
    - ../vars/user_roles.yml

  tasks:

    - name: Ensure existence of groups
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: >-
        {{
          users
          | map(attribute='group_name')
          | map('extract', user_roles)
          | map(attribute='groups')
          | flatten
          | unique
        }}

    - name: Create Users
      ansible.builtin.user:
        name: "{{ item.name }}"
        groups: "{{ user_roles[item.group_name].groups | join(',') }}"
        append: yes
        create_home: yes
        password_lock: true
        shell: "{{ item.shell }}"
        state: "{{ item.state }}"
      loop: "{{ users }}"
    - name: Ensure files directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../files"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Ensure SSH Directories exist
      ansible.builtin.file:
        path: "/home/{{ item.name }}/.ssh"
        state: directory
        mode: '0700'
        owner: "{{ item.name }}"
        group: "{{ item.name }}"
      when: item.state == "present"
      loop: "{{ users }}"

    - name: Generate SSH Key pair (idempotent)
      ansible.builtin.openssh_keypair:
         path: "{{ playbook_dir }}/../files/{{ item.name }}"
         type: ed25519
      args:
        creates: "{{ playbook_dir }}/../files/{{ item.name }}"
      delegate_to: localhost
      register: ssh_keys
      loop: "{{ users }}"
      when: item.state == "present"

    - name: Set authorized key (single source of truth)
      ansible.posix.authorized_key:
         user: "{{ item.item.name }}"
         key: "{{ item.public_key }}"
         exclusive: true
      loop: "{{ ssh_keys.results }}"


    - name: Setup sudo access
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ item.name }}"
        content: "{{ item.name }} {{ user_roles[item.group_name].sudo | trim }}\n"
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'
      when:
        - item.state == "present"
        - user_roles[item.group_name].sudo | length > 0
      loop: "{{ users }}"
